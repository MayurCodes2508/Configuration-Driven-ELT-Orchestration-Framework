main:
  steps:
    - assign_values:
        steps:
          - assign_env_vars:
              assign:
                - projectNumber: $${sys.get_env("GOOGLE_CLOUD_PROJECT_NUMBER")}
                - projectID: $${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                - location: $${sys.get_env("GOOGLE_CLOUD_LOCATION")}
                - workflowID: $${sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID")}
                - workflowRevisionID: $${sys.get_env("GOOGLE_CLOUD_WORKFLOW_REVISION_ID")}
                - workflowExecutionID: $${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
                - DBT_TARGET: "dev"

          - assign_strings_A:
              assign:
                - app_url: "https://dev-execution-service-144449440045.asia-south1.run.app"

          - checking_for_server_activity_status:
              try:
                steps:
                  - calling_run_service_for_status:
                      call: http.post
                      args:
                        url: $${app_url + "/status"}
                        auth:
                          type: OIDC
                        body: {}

                  - log_success_server_status_response:
                      call: sys.log
                      args:
                        data:
                          message: "Server is active, executions can be started"
                          projectNumber: $${projectNumber}
                          projectID: $${projectID}
                          location: $${location}
                          workflowID: $${workflowID}
                          workflowRevisionID: $${workflowRevisionID}
                          workflowExecutionID: $${workflowExecutionID}
                        severity: INFO

              except:
                as: e
                steps:
                  - log_failed_server_status_response:
                      call: sys.log
                      args:
                        data:
                          message: "Server is not active, cannot start executions"
                          error: $${e}
                          projectNumber: $${projectNumber}
                          projectID: $${projectID}
                          location: $${location}
                          workflowID: $${workflowID}
                          workflowRevisionID: $${workflowRevisionID}
                          workflowExecutionID: $${workflowExecutionID}
                        severity: CRITICAL

                  - handling_call_failure:
                      raise:
                        message: "Server is not active, cannot start executions"

          - execution:
              steps:
                - call_secrets_manager:
                    steps:
                      - get_secrets_and_assign:
                          steps:
                            - init_A:
                                assign:
                                  - CoingeckoAPIKeySecret: null
                                  - NeonDBURLSecret: null
                            
                            - parallel_and_branches_A:
                                parallel:
                                  shared:
                                    - CoingeckoAPIKeySecret
                                    - NeonDBURLSecret
                                  branches:
                                    - get_and_assign_coingecko_api_key:
                                        steps:
                                          - get_coingecko_api_key:
                                              call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
                                              args:
                                                secret_id: "coingecko-api-key-secret"
                                                version: "1"
                                                project_id: $${projectID}
                                              result: CoingeckoAPIKeyStringResult

                                          - assign_coingecko_api_key:
                                              assign:
                                                - CoingeckoAPIKeySecret: $${CoingeckoAPIKeyStringResult}

                                    - get_and_assign_neon_db_url:
                                        steps:
                                          - get_neon_db_url:
                                              call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
                                              args:
                                                secret_id: "neon-db-url-secret"
                                                version: "1"
                                                project_id: $${projectID}
                                              result: NeonDBURLStringResult

                                          - assign_neon_db_url:
                                              assign:
                                                - NeonDBURLSecret: $${NeonDBURLStringResult}

                - call_run_service:
                    steps:
                      - assign_list_A:
                          assign:
                            - catalog:
                              "dev-framework-execution-pipeline":
                                - job_name: "dev_coingecko_market_price"
                                  path: "elt_system/configs/job/coingecko_sources/dev/market_price.json"
                              "dev-framework-observability-pipeline":
                                - job_name: "dev_neon_pipeline_runs"
                                  path: "metadata_system/configs/job/neon_sources/dev/pipeline_runs.json"
                                - job_name: "dev_neon_job_runs"
                                  path: "metadata_system/configs/job/neon_sources/dev/job_runs.json"
                                - job_name: "dev_bigquery_test_exposures"
                                  path: "metadata_system/configs/job/bigquery_sources/dev/test_exposures.json"
                                - job_name: "dev_bigquery_run_exposures"
                                  path: "metadata_system/configs/job/bigquery_sources/dev/run_exposures.json"

                      - assign_strings_B:
                          assign:
                            - method_A: "pipeline_start_metadata"
                            - method_B: "pipeline_start_logger"
                            - method_C: "job_logger"
                            - method_D: "pipeline_end_metadata"
                            - method_E: "pipeline_end_logger"
                          
                      - parallel_execution_A:
                          parallel:
                            for:
                              value: "pipeline"
                              in: $${keys(catalog)}
                              steps:
                                - execute_service_for_pipeline_start_metadata_and_logging:
                                    steps:
                                      - calling_service_A:
                                          call: http.post
                                          args:
                                            url: $${app_url + "/execute"}
                                            auth:
                                              type: OIDC
                                            body:
                                              pipeline_name: $${pipeline}
                                              method: $${method_A}
                                          result: call_result_A

                                      - calling_service_B:
                                          call: http.post
                                          args:
                                            url: $${app_url + "/execute"}
                                            auth:
                                              type: OIDC
                                            body:
                                              NeonDBURLSecret: $${NeonDBURLSecret}
                                              pipeline_start_metadata_result: $${call_result_A.body}
                                              method: $${method_B}

                                      - assign_list_B:
                                          assign:
                                            - jobs: $${catalog[pipeline]}

                                      - test_log:
                                          call: sys.log
                                          args:
                                            data: $${jobs}
                                            severity: INFO