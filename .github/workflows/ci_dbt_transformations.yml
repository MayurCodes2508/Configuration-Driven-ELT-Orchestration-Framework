name: CI - dbt Transformations

defaults:
  run:
    working-directory: ./platform/metadata_system/dbt/

permissions:
  id-token: write
  contents: read

####################### Triggers ###############################

on:
  push:
    branches:
      - dev
      - feature/**

    paths:
      - platform/metadata_system/dbt/**

  workflow_dispatch:
    
######################## Jobs #######################################

jobs:

######################## Build #######################################

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "projects/144449440045/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-workflows@instant-medium-491107-t6.iam.gserviceaccount.com"

      - name: Set up python 3.12.3
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'

      - name: Setup Dependencies & Validate
        run: |
          echo "=== Step Start ==="
          python -m ensurepip --default-pip
          pip install -r dbt-requirements.txt
          echo "=== Broken Requirements Check ==="
          pip check
          echo "=== Step End ==="

      - name: Setup dbt Dependencies
        run: |
          echo "=== Step Start ==="
          echo "=== DBT_TARGET: $DBT_TARGET ==="
          dbt deps \
          --project-dir .
          echo "=== Step End ==="
        env:
          DBT_TARGET: ${{ vars.DBT_TARGET }}

      - name: dbt Build
        run: |
          echo "=== Step Start ==="
          echo "=== DBT_TARGET: $DBT_TARGET ==="
          dbt build -s "tag:observability,tag:prod" \
          --profiles-dir .
          echo "=== Step End ==="
        env:
          DBT_TARGET: ${{ vars.DBT_TARGET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
